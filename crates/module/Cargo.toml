[package]
name = "adele-voice-module"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

# The embeddable voice module: on-demand dictation + speech playback, with no
# wake word, no D-Bus, and no orchestrator/assistant coupling. Depends only on
# the domain (`core`) and the adapter crates it wires for the concrete builders.
[dependencies]
adele-voice-core.workspace = true
adele-voice-audio-cpal.workspace = true
adele-voice-vad-silero.workspace = true
adele-voice-stt-whisper.workspace = true
adele-voice-tts-piper.workspace = true
adele-voice-tts-polly.workspace = true
adele-voice-tts-kokoro.workspace = true
# The metrics facade (adelie-ai/mcp-core#38): duration histograms for STT
# transcribe / TTS synthesize and the energy-gate drop counter. `Transcriber`
# and `Speaker` are the single chokepoints each backend flows through, so the
# instrumentation lives here rather than in every backend crate. No `otel`
# feature passthrough needed: the facade records into the shared registry
# with or without export, and whether export is compiled in is the daemon's
# call (its `otel` feature unifies this crate's copy too).
adelie-telemetry = { git = "https://github.com/adelie-ai/adelie-telemetry", rev = "1b8166ab483174e76aa23079858b8a31aaa52ae1" }
dirs.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }
toml.workspace = true

[lints]
workspace = true
