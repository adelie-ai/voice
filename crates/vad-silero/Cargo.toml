[package]
name = "adele-voice-vad-silero"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[features]
# Load ONNX Runtime at RUNTIME (dlopen) instead of linking it at build time.
#
# Why this exists: `ort` publishes no prebuilt ONNX Runtime for
# `x86_64-apple-darwin`, so the default (link-time) path fails outright there:
#
#   error: ort does not provide prebuilt binaries for the target
#          `x86_64-apple-darwin` with feature set (no features)
#
# `load-dynamic` sidesteps it: nothing is linked at build time, and the library
# is resolved from the system at first use. This is for a consumer that wants
# Silero VAD *and* runs on such a target. A consumer that only needs to keep
# `ort` out of its graph should instead decline the `vad-silero` feature of
# `adele-voice-module`, which is the cheaper answer and needs no runtime library.
#
# **Off by default on purpose.** Every existing (Linux) consumer keeps the
# current link-time behaviour byte-for-byte; only a target that opts in changes.
# The trade is that an opted-in build needs `libonnxruntime` present at runtime
# (e.g. `brew install onnxruntime`, or `ORT_DYLIB_PATH`), and will fail when the
# VAD is first used rather than at build time.
#
# Also what the repo's own `just check` uses on a host with no prebuilt `ort`:
# feature unification turns it on for every dependent, so the whole workspace
# builds. See adelie-ai/voice#133 for native macOS VAD/STT via Apple's Speech
# framework, which removes the need for either path there.
load-dynamic = ["ort/load-dynamic"]

[dependencies]
adele-voice-core.workspace = true
anyhow.workspace = true
ort = "2.0.0-rc.12"
ndarray = "0.17"
tracing.workspace = true

[lints]
workspace = true
